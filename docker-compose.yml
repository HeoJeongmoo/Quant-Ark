# docker compose up -d --build   → 백그라운드 상시 가동
# docker compose logs -f         → 봇 로그 보기
# docker compose down            → 끄기 (data/ 기록은 남음)
services:
  quant-office:
    build: .
    image: quant-office:latest
    container_name: quant-office
    restart: always # 꺼지거나 오류로 죽으면 자동 재시작, 서버 재부팅 후 Docker가 켜지면 같이 시작
    env_file: .env # APP_KEY, APP_SECRET, CANO, ANTHROPIC_API_KEY ... (이미지 안에는 넣지 않음)
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8787
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8787:8787" # 같은 기계에서만 열림. 인터넷 접속은 아래 Caddy(HTTPS + 로그인)를 거쳐서만
    volumes:
      - ./data:/app/data
      - ./.kis-cache:/app/.kis-cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/bot/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------- 인터넷 공개용 (클라우드 서버에서만) ----------
  # .env에 COMPOSE_PROFILES=public, PUBLIC_HOST=34-12-56-78.sslip.io, APP_PASSWORD=... 를 넣으면 같이 켜짐
  # 자동 HTTPS(Let's Encrypt) → https://PUBLIC_HOST 로 접속. 내 PC에서는 프로필이 없어서 켜지지 않음
  caddy:
    image: caddy:2-alpine
    container_name: quant-caddy
    profiles: ["public"]
    restart: always
    network_mode: host # 80/443을 받아서 127.0.0.1:8787(봇)로 넘김
    command: caddy reverse-proxy --from ${PUBLIC_HOST:-localhost} --to 127.0.0.1:8787
    volumes:
      - ./data/caddy:/data # 인증서 보관
    depends_on:
      - quant-office
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
